<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="gambar/logo-32x32.png" sizes="32x32">
    <title>Admin Login - Udin Kuota</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .login-card h2 {
            color: #1e293b;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .btn-back {
            display: inline-block;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #1e293b;
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.75rem;
            min-height: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Logo Website (Silakan ganti dengan tag <img> jika ada file logo) -->
        <div class="logo-placeholder">🏪</div>
        <h2>Admin Login</h2>
        
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Email Admin</label>
                <input type="email" id="email" placeholder="Masukkan email" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">Masuk ke Sistem</button>
            <p id="loginError" class="error-msg"></p>
        </form>

        <a href="index.html" class="btn-back">← Kembali ke Halaman Utama</a>
    </div>

    <!-- Proses Firebase Auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8iht3iWBvxTcrKy_Ks9663qsPOodQ5Nw",
            authDomain: "udin-kuota.firebaseapp.com",
            projectId: "udin-kuota",
            storageBucket: "udin-kuota.firebasestorage.app",
            messagingSenderId: "634570933178",
            appId: "1:634570933178:web:91aabb192e9f51d90a1383"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorElement = document.getElementById('loginError');

            try {
                errorElement.innerText = "Mencoba masuk...";
                await signInWithEmailAndPassword(auth, email, pass);
                // Jika sukses, lempar langsung ke index.html
                window.location.href = "index.html";
            } catch (error) {
                console.error(error);
                errorElement.innerText = "Gagal login: Periksa kembali email & password Anda.";
            }
        });
    </script>
</body>

</html>
