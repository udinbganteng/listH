<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="gambar/logo-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="gambar/logo-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="gambar/logo-180x180.png">
    <title>KuotaKu</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #16a34a;
            --success-hover: #15803d;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --admin-color: #4f46e5;
            --admin-bg: #f5f3ff;
            --admin-border: #ddd6fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 20px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), #3b82f6);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* --- LOCK/ADMIN TRIGGER BUTTON --- */
        .admin-trigger {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- FORM TAMBAH PRODUK (SELLER ONLY) --- */
        .admin-form-container {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: none;
        }

        .admin-card-form {
            background: var(--admin-bg);
            border: 2px dashed var(--admin-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .admin-card-form h3 {
            color: #5b21b6;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4c1d95;
        }

        .form-group input, .form-group select {
            padding: 0.4rem;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            background: #ffffff;
        }

        .btn-admin-submit {
            background-color: var(--admin-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* --- FILTER NAVIGATION (DYNAMIC TABS) --- */
        .tabs-container {
            max-width: 1200px;
            margin: 0 auto 0.5rem auto;
            padding: 0 0.75rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tabs-wrapper {
            display: flex;
            gap: 0.4rem;
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 0.4rem 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* --- SUB-FILTER KATEGORI & URUTAN HARGA --- */
        .filters-row {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .sub-filters {
            display: flex;
            gap: 0.4rem;
        }

        .sub-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-btn.active {
            background-color: #e2e8f0;
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .sort-select {
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 0.75rem;
        }

        section h2 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* --- HORIZONTAL PRODUCT LIST --- */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            display: grid;
            grid-template-columns: 2.5fr 1.5fr 1.2fr;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            transition: box-shadow 0.2s;
        }

        .badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
        }

        .telkomsel { background: #fee2e2; color: #ef4444; }
        .indosat { background: #fef3c7; color: #d97706; }
        .xl { background: #dbeafe; color: #2563eb; }
        .axis { background: #f3e8ff; color: #9333ea; }
        .three { background: #f1f5f9; color: #0f172a; }
        .smartfren { background: #fce7f3; color: #db2777; }
        .liveon { background: #e0f2fe; color: #0369a1; }
        .byu { background: #e0f2fe; color: #06b6d4; }

        .prod-info-main {
            display: flex;
            flex-direction: column;
        }

        .prod-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prod-meta-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .prod-price-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prod-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .prod-active-period {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .btn-buy {
            width: 100%;
            padding: 0.45rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            background-color: var(--success-color);
            color: white;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--success-hover);
        }

        .seller-info-panel {
            grid-column: 1 / -1;
            background: #faf5ff;
            border-top: 1px dashed #e9d5ff;
            padding-top: 0.4rem;
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        .seller-info-panel h4 {
            color: #6b21a8;
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
        }

        .seller-meta span {
            font-weight: 700;
            color: #4c1d95;
        }

        /* --- MODAL INPUT NOMOR TUJUAN --- */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center; 
            justify-content: center;
            padding: 1rem;
        }
        
        .modal-content {
            background: #fff; 
            border-radius: 12px; 
            padding: 1.5rem; 
            width: 100%; 
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { 
            from { transform: translateY(20px); opacity:0; } 
            to { transform: translateY(0); opacity:1; } 
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .modal-body p {
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-wrapper label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-wrapper input {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.75rem;
            display: none;
            font-weight: 600;
        }

        .modal-actions {
            display: flex; 
            gap: 0.5rem; 
            justify-content: flex-end; 
            margin-top: 1.5rem;
        }

        .btn-cancel, .btn-confirm { 
            padding: 0.5rem 1rem; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem;
        }

        .btn-cancel { 
            background: #e2e8f0; 
            color: #334155; 
        }

        .btn-confirm { 
            background: var(--success-color); 
            color: #fff; 
        }

        /* --- TOAST NOTIFICATION --- */
        .toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #334155;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 400px) {
            .product-card {
                grid-template-columns: 2fr 1.3fr 1.1fr;
                padding: 0.5rem;
                gap: 0.3rem;
            }
            .prod-name { font-size: 0.8rem; }
            .prod-price { font-size: 0.85rem; }
            .btn-buy { font-size: 0.75rem; padding: 0.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <button class="admin-trigger" id="adminBtn" onclick="toggleAdminMode()">🔒 Mode Penjual</button>
        <h1>Kuotaku Store</h1>
        <p>List harga kuota internet terlengkap. Sekali klik langsung order ke WhatsApp!</p>
    </header>

    <!-- ADMIN PANEL FORM -->
    <div class="admin-form-container" id="adminFormContainer">
        <div class="admin-card-form">
            <h3>🛠️ Panel Input Paket Data Baru (Khusus Penjual)</h3>
            <form id="newProductForm" onsubmit="addNewProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="pName">Nama Paket/Produk</label>
                        <input type="text" id="pName" placeholder="Contoh: Mini Data 2GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pProvider">Provider</label>
                        <select id="pProvider" required>
                            <option value="Telkomsel">Telkomsel</option>
                            <option value="Indosat">Indosat</option>
                            <option value="XL">XL</option>
                            <option value="Axis">Axis</option>
                            <option value="Three">Three</option>
                            <option value="Smartfren">Smartfren</option>
                            <option value="LiveOn">LiveOn</option>
                            <option value="ByU">ByU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pType">Kategori Durasi</label>
                        <select id="pType" required>
                            <option value="harian">⏳ Harian</option>
                            <option value="mingguan">🗓️ Mingguan/Bulanan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pQuota">Jumlah Kuota</label>
                        <input type="text" id="pQuota" placeholder="Contoh: 2 GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pActive">Masa Aktif</label>
                        <input type="text" id="pActive" placeholder="Contoh: 3 Hari" required>
                    </div>
                    <div class="form-group">
                        <label for="pPrice">Harga Jual (Rupiah)</label>
                        <input type="number" id="pPrice" placeholder="Contoh: 15000" required>
                    </div>
                    <div class="form-group">
                        <label for="pLocation">Lokasi Tembak Menu</label>
                        <input type="text" id="pLocation" placeholder="Isi Ulang Data > ..." required>
                    </div>
                    <div class="form-group">
                        <label for="pNote">Catatan Kulakan</label>
                        <input type="text" id="pNote" placeholder="Paket ada di menu..." required>
                    </div>
                </div>
                <button type="submit" class="btn-admin-submit">➕ Tambahkan ke Daftar Harga</button>
            </form>
        </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="tabs-container">
        <div class="tabs-wrapper" id="dynamicTabsWrapper">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </div>

    <!-- SUB FILTERS & SORTING HARGA -->
    <div class="filters-row">
        <div class="sub-filters">
            <button class="sub-btn active" id="subAll" onclick="filterCategory('all')">Semua Durasi</button>
            <button class="sub-btn" id="subHarian" onclick="filterCategory('harian')">⏳ Harian</button>
            <button class="sub-btn" id="subMingguan" onclick="filterCategory('mingguan')">🗓️ Mingguan/Bulanan</button>
        </div>
        <div>
            <select id="sortPrice" class="sort-select" onchange="changeSort(this.value)">
                <option value="default">Urutan Bawaan</option>
                <option value="asc">Harga Termurah</option>
                <option value="desc">Harga Termahal</option>
            </select>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <section>
            <h2 id="sectionTitle">📶 Semua Paket Internet</h2>
            <div class="product-grid" id="productGrid">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </section>
    </main>

    <!-- MODAL INPUT NOMOR -->
    <div id="buyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Pembelian</div>
            <div class="modal-body">
                <p id="modalPackageName">Nama Paket: -</p>
                <p id="modalPackagePrice">Harga: -</p>
                
                <div class="input-wrapper">
                    <label for="targetNumber">Nomor Tujuan (Opsional)</label>
                    <input type="number" id="targetNumber" placeholder="Contoh: 0812... atau 628...">
                    <span id="numberError" class="error-msg">Nomor harus diawali 08 atau 62.</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-confirm" onclick="processBuy()">Lanjut ke WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">✅ Paket berhasil dipilih, mengarahkan ke WhatsApp...</div>

    <script>
        /* --- KONFIGURASI --- */
        const NOMOR_WA = "6289638435479"; // Ubah dengan nomor WA Penjual

        /* --- MASTER DATA PRODUK --- */
        const products = [
            // Telkomsel Harian

            { id: 6, name: "Telkomsel Mini Data 7GB", provider: "Telkomsel", type: "harian", quota: "7 GB", activePeriod: "3 Hari", price: 29000, class: "telkomsel", location: "Isi Ulang Data > Paket Mini Data > harian", note: "Paling laris untuk streaming harian." },
            { id: 7, name: "Telkomsel Mini Data 8GB", provider: "Telkomsel", type: "harian", quota: "8 GB", activePeriod: "2 Hari", price: 30000, class: "telkomsel", location: "Isi Ulang Data > Paket Mini Data > harian", note: "Pengisian instan." },
            
            // Telkomsel Mingguan / Bulanan

            { id: 11, name: "Telkomsel Mini Data 1.5GB", provider: "Telkomsel", type: "mingguan", quota: "1.5 GB", activePeriod: "14 Hari", price: 28000, class: "telkomsel", location: "Isi Ulang Data > Paket Mini Data > Mingguan", note: "Sering dipakai anak sekolahan." },
            
            // AXIS
            { id: 40, name: "Aigo Mini 5GB + Bonus", provider: "Axis", type: "harian", quota: "5 GB", activePeriod: "1 Hari", price: 8000, class: "axis", location: "Aigo Kuota Mini > 1-3hari", note: "Paket reguler non-lokal." },
            { id: 41, name: "Aigo Mini 15GB + Bonus", provider: "Axis", type: "harian", quota: "15 GB", activePeriod: "1 Hari", price: 10000, class: "axis", location: "Aigo Kuota Mini > 1-3hari", note: "Paket reguler non-lokal." },
            { id: 42, name: "Aigo Mini 5GB + Bonus", provider: "Axis", type: "harian", quota: "5 GB", activePeriod: "2 Hari", price: 10000, class: "axis", location: "Aigo Kuota Mini > 1-3hari", note: "Paket reguler non-lokal." },
            { id: 43, name: "Aigo Mini 5GB + Bonus", provider: "Axis", type: "harian", quota: "5 GB", activePeriod: "3 Hari", price: 12000, class: "axis", location: "Aigo Kuota Mini > 1-3hari", note: "Paket reguler non-lokal." },
            
            // Tri
            { id: 50, name: "TRI 6GB", provider: "Three", type: "harian", quota: "6GB", activePeriod: "1 Hari", price: 8000, class: "three", location: "paket Happy", note: "Full kuota 24 jam nonstop." },
            { id: 51, name: "TRI 10GB", provider: "Three", type: "harian", quota: "10GB", activePeriod: "1 Hari", price: 10000, class: "three", location: "paket Happy", note: "Full kuota 24 jam nonstop." },
            { id: 57, name: "TRI 3GB", provider: "Three", type: "mingguan", quota: "3GB", activePeriod: "28 Hari", price: 22000, class: "three", location: "paket Happy", note: "Full kuota 24 jam nonstop." },

            // Indosat
            { id: 70, name: "Indosat Freedom Mini 1GB", provider: "Indosat", type: "harian", quota: "1GB", activePeriod: "2 Hari", price: 8000, class: "indosat", location: "Isi Ulang > Fredoom Mini Data > All Nasional", note: "Full kuota 24 jam nonstop." },
            { id: 76, name: "PROMO Indosat Freedom 4GB", provider: "Indosat", type: "mingguan", quota: "4GB", activePeriod: "28 Hari", price: 24000, class: "indosat", location: "Isi Ulang > Fredoom Data > Mobo", note: "Full kuota 24 jam nonstop." }
        ];

        let currentFilter = 'all';
        let currentCategory = 'all';
        let currentSort = 'default';
        let isAdminMode = false;
        let selectedProductId = null; // Menyimpan ID paket yg dipilih di Modal

        // Inisialisasi Aplikasi saat Load Pertama Kali
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderProducts();
        });

        /* --- DINAMIS PROVIDER MENUS GENERATOR --- */
        function renderTabs() {
            const wrapper = document.getElementById('dynamicTabsWrapper');
            const uniqueProviders = ['all'];
            products.forEach(p => {
                if (!uniqueProviders.includes(p.provider)) {
                    uniqueProviders.push(p.provider);
                }
            });

            const providerNames = {
                'all': '🔥 Semua',
                'Telkomsel': '🔴 Telkomsel',
                'Indosat': '🟡 Indosat',
                'XL': '🔵 XL Axiata',
                'Axis': '🟣 Axis',
                'Three': '⚫ Three (3)',
                'Smartfren': '💗 Smartfren',
                'LiveOn': '💎 Live.On',
                'ByU': '🔷 By.U'
            };

            wrapper.innerHTML = uniqueProviders.map(prov => {
                const displayName = providerNames[prov] || prov;
                const activeClass = currentFilter === prov ? 'active' : '';
                return `<button class="tab-btn ${activeClass}" id="tab-${prov}" onclick="filterProvider('${prov}')">${displayName}</button>`;
            }).join('');
        }

        /* --- LOGIKA MODAL PEMBELIAN & VALIDASI NOMOR --- */
        function openBuyModal(id) {
            selectedProductId = id;
            const item = products.find(p => p.id === id);
            if (!item) return;

            // Set text di Modal
            document.getElementById('modalPackageName').innerText = `Nama Paket: ${item.name}`;
            document.getElementById('modalPackagePrice').innerText = `Harga: Rp ${item.price.toLocaleString('id-ID')}`;
            
            // Reset input form
            document.getElementById('targetNumber').value = '';
            document.getElementById('numberError').style.display = 'none';

            // Tampilkan modal
            document.getElementById('buyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('buyModal').style.display = 'none';
            selectedProductId = null;
        }

        function processBuy() {
            const numInput = document.getElementById('targetNumber').value.trim();
            const errorMsg = document.getElementById('numberError');

            // Validasi Nomor jika diisi (Hanya 08 atau 62)
            if (numInput !== '') {
                if (!numInput.startsWith('08') && !numInput.startsWith('62')) {
                    errorMsg.style.display = 'block';
                    return; // Hentikan proses jika nomor salah
                }
            }
            const productId = selectedProductId;
            // Jika valid / dikosongkan
            errorMsg.style.display = 'none';
            closeModal();
            showToast();

            // Eksekusi Generate Link WhatsApp (Delay 1.5 detik agar toast terbaca)
            setTimeout(() => {
                const item = products.find(p => p.id === productId);
                const formatPrice = item.price.toLocaleString('id-ID');
                
                // Format Pesan
                let rawMessage = `Halo, saya ingin membeli paket berikut:\n` +
                                 `Provider: ${item.provider}\n` +
                                 `Nama Paket: ${item.name}\n` +
                                 `Kuota: ${item.quota}\n` +
                                 `Masa Aktif: ${item.activePeriod}\n` +
                                 `Harga: Rp ${formatPrice}\n` +
                                 `Lokasi: ${item.location}`;
                
                // Tambahkan Nomor Tujuan jika tidak kosong
                if (numInput !== '') {
                    rawMessage += `\nNomor Tujuan: ${numInput}`;
                }

                const encodedText = encodeURIComponent(rawMessage);
                const waUrl = `https://api.whatsapp.com/send?phone=${NOMOR_WA}&text=${encodedText}`;
                
                window.open(waUrl, '_blank');
            }, 1500);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.className = "toast show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 2000); // Hilang setelah 2 detik
        }

        /* --- RENDER DAFTAR PRODUK --- */
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            // Filter Berdasarkan Provider & Kategori
            let filtered = products.filter(p => {
                const matchProv = (currentFilter === 'all' || p.provider === currentFilter);
                const matchCat = (currentCategory === 'all' || p.type === currentCategory);
                return matchProv && matchCat;
            });

            // Pengurutan (Sorting) Harga
            if (currentSort === 'asc') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.9rem;">Paket tidak ditemukan.</div>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';

                let adminPanelHtml = '';
                if (isAdminMode) {
                    adminPanelHtml = `
                        <div class="seller-info-panel">
                            <h4>🛠️ Data Kulakan Seller:</h4>
                            <div class="seller-meta">📍 Tembak: <span>${p.location}</span></div>
                            <div class="seller-meta">📝 Note: <span>${p.note}</span></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="prod-info-main">
                        <div><span class="badge ${p.class}">${p.provider}</span></div>
                        <div class="prod-name" title="${p.name}">${p.name}</div>
                        <div class="prod-meta-sub">${p.quota}</div>
                    </div>
                    <div class="prod-price-box">
                        <div class="prod-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        <div class="prod-active-period">⌛ ${p.activePeriod}</div>
                    </div>
                    <div>
                        <button class="btn-buy" onclick="openBuyModal(${p.id})">Beli</button>
                    </div>
                    ${adminPanelHtml}
                `;
                grid.appendChild(card);
            });
        }

        /* --- CONTROLLER FILTER & SORTING --- */
        function filterProvider(prov) {
            currentFilter = prov;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${prov}`);
            if (activeTab) activeTab.classList.add('active');

            const providerTitles = { 'all': 'Semua Paket Internet' };
            document.getElementById('sectionTitle').innerText = `📶 ${providerTitles[prov] || 'Paket ' + prov}`;
            
            renderProducts();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            
            if (cat === 'all') document.getElementById('subAll').classList.add('active');
            if (cat === 'harian') document.getElementById('subHarian').classList.add('active');
            if (cat === 'mingguan') document.getElementById('subMingguan').classList.add('active');

            renderProducts();
        }

        function changeSort(val) {
            currentSort = val;
            renderProducts();
        }

        /* --- SELLER INTERNAL FEATURES CONTROL --- */
        function toggleAdminMode() {
            const formContainer = document.getElementById('adminFormContainer');
            if (!isAdminMode) {
                const password = prompt("Masukkan Kode Keamanan Penjual:");
                if (password === "ujangRonda") {
                    isAdminMode = true;
                    document.getElementById('adminBtn').innerText = "🔓 Mode Penjual (Aktif)";
                    document.getElementById('adminBtn').style.background = "var(--danger-color)";
                    formContainer.style.display = 'block';
                    alert("Akses diterima. Informasi menu penembakan rahasia di bawah produk sekarang aktif.");
                    renderProducts();
                } else {
                    alert("Kode salah!");
                }
            } else {
                isAdminMode = false;
                document.getElementById('adminBtn').innerText = "🔒 Mode Penjual";
                document.getElementById('adminBtn').style.background = "rgba(255, 255, 255, 0.2)";
                formContainer.style.display = 'none';
                renderProducts();
            }
        }

        function addNewProduct(event) {
            event.preventDefault();

            const name = document.getElementById('pName').value;
            const provider = document.getElementById('pProvider').value;
            const type = document.getElementById('pType').value;
            const quota = document.getElementById('pQuota').value;
            const activePeriod = document.getElementById('pActive').value;
            const price = parseInt(document.getElementById('pPrice').value);
            const location = document.getElementById('pLocation').value;
            const note = document.getElementById('pNote').value;
            
            let providerClass = provider.toLowerCase();
            if(provider === "XL") providerClass = "xl";
            if(provider === "ByU") providerClass = "byu";
            if(provider === "LiveOn") providerClass = "liveon";

            const newProduct = {
                id: Date.now(),
                name, provider, type, quota, activePeriod, price,
                class: providerClass, location, note
            };

            products.push(newProduct);
            alert(`Paket "${name}" Berhasil ditambahkan ke Aplikasi!`);
            
            document.getElementById('newProductForm').reset();
            renderTabs(); 
            renderProducts();
        }
    </script>
</body>
</html>
