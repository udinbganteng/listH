    <!-- ADMIN PANEL FORM -->
    <div class="admin-form-container" id="adminFormContainer" style="display: none;">
        <!-- Halaman Login -->
        <div id="loginPage" class="loginpage">
            <h3>🔐 Admin Login</h3>
            <input type="email" id="email" placeholder="Email admin"
                style="width:100%; margin-bottom:10px; padding:8px;" autocomplete="off">
            <input type="password" id="password" placeholder="Password"
                style="width:100%; margin-bottom:10px; padding:8px;" autocomplete="off">
            <button onclick="loginAdmin()"
                class="login">Login</button>
            <p id="loginError" style="color:red; font-size:0.8rem; margin-top:5px;"></p>
        </div>

        <!-- Form Produk (Akan ditampilkan lewat JS setelah login) -->
        <div id="adminControls" style="display: none;">
            <div class="logoutpage">
                <h3>🔐 Admin Logout</h3>
                <!-- <h3>🛠️ Panel Input Paket Data Baru</h3> -->
                <!-- Form input produk tetap di sini -->
                <button onclick="logoutAdmin()" class="logout" style="background:var(--danger-color); margin-top:10px;">Logout</button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="tabs-container">
        <div class="tabs-wrapper" id="dynamicTabsWrapper">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </div>

    <!-- SUB FILTERS & SORTING HARGA -->
    <div class="filters-row">
        <div class="sub-filters">
            <button class="sub-btn active" id="subAll" onclick="filterCategory('all')">Semua Durasi</button>
            <button class="sub-btn" id="subHarian" onclick="filterCategory('harian')">⏳ Harian</button>
            <button class="sub-btn" id="subMingguan" onclick="filterCategory('mingguan')">🗓️ Mingguan/Bulanan</button>
        </div>
        <div>
            <select id="sortPrice" class="sort-select" onchange="changeSort(this.value)">
                <option value="default">Urutan Bawaan</option>
                <option value="asc">Harga Termurah</option>
                <option value="desc">Harga Termahal</option>
            </select>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <section>
            <h2 id="sectionTitle">📶 Semua Paket Internet</h2>
            <div class="product-grid" id="productGrid">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </section>
    </main>

    <!-- MODAL INPUT NOMOR -->
    <div id="buyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Pembelian</div>
            <div class="modal-body">
                <p id="modalPackageName">Nama Paket: -</p>
                <p id="modalPackagePrice">Harga: -</p>

                <div class="input-wrapper">
                    <label for="targetNumber">Nomor Tujuan (Opsional)</label>
                    <input type="number" id="targetNumber" placeholder="Contoh: 0812... atau 628...">
                    <span id="numberError" class="error-msg">Nomor harus diawali 08 atau 62.</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-confirm" onclick="processBuy()">Lanjut ke WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">✅ Paket berhasil dipilih, mengarahkan ke WhatsApp...</div>

    <!-- ========================================================
         SCRIPT: FIREBASE MODULAR SDK + LOGIKA APLIKASI

    <script type="module" src="script.js">
