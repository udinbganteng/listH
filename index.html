<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="gambar/logo-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="gambar/logo-192x192.png" sizes="192x192">
    <link class="apple-touch-icon" href="gambar/logo-180x180.png">
    <title>KuotaKu</title>
    
    <!-- 1. Import Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #16a34a;
            --success-hover: #15803d;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --admin-color: #4f46e5;
            --admin-bg: #f5f3ff;
            --admin-border: #ddd6fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 20px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), #3b82f6);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* --- LOCK/ADMIN TRIGGER BUTTON --- */
        .admin-trigger {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- FORM TAMBAH PRODUK (SELLER ONLY) --- */
        .admin-form-container {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: none;
        }

        .admin-card-form {
            background: var(--admin-bg);
            border: 2px dashed var(--admin-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .admin-card-form h3 {
            color: #5b21b6;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4c1d95;
        }

        .form-group input, .form-group select {
            padding: 0.4rem;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            background: #ffffff;
        }

        .btn-admin-submit {
            background-color: var(--admin-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* --- FILTER NAVIGATION (DYNAMIC TABS) --- */
        .tabs-container {
            max-width: 1200px;
            margin: 0 auto 0.5rem auto;
            padding: 0 0.75rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tabs-wrapper {
            display: flex;
            gap: 0.4rem;
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 0.4rem 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* --- SUB-FILTER KATEGORI & URUTAN HARGA --- */
        .filters-row {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .sub-filters {
            display: flex;
            gap: 0.4rem;
        }

        .sub-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-btn.active {
            background-color: #e2e8f0;
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .sort-select {
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 0.75rem;
        }

        section h2 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* --- HORIZONTAL PRODUCT LIST --- */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            display: grid;
            grid-template-columns: 2.5fr 1.5fr 1.2fr;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            transition: box-shadow 0.2s, opacity 0.3s ease;
        }

        /* FITUR BARU: Efek meredup saat stok habis */
        .product-card.out-of-stock {
            opacity: 0.65;
            filter: grayscale(10%);
        }

        .badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
        }

        .telkomsel { background: #fee2e2; color: #ef4444; }
        .indosat { background: #fef3c7; color: #d97706; }
        .xl { background: #dbeafe; color: #2563eb; }
        .axis { background: #f3e8ff; color: #9333ea; }
        .three { background: #f1f5f9; color: #0f172a; }
        .smartfren { background: #fce7f3; color: #db2777; }
        .liveon { background: #e0f2fe; color: #0369a1; }
        .byu { background: #e0f2fe; color: #06b6d4; }

        /* FITUR BARU: Warna badge stok habis */
        .badge-stok-habis {
            background: var(--danger-color);
            color: white;
            margin-left: 0.3rem;
        }

        .prod-info-main {
            display: flex;
            flex-direction: column;
        }

        .prod-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prod-meta-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .prod-price-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prod-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .prod-active-period {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .btn-buy {
            width: 100%;
            padding: 0.45rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            background-color: var(--success-color);
            color: white;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--success-hover);
        }

        /* FITUR BARU: Style untuk tombol yang dinonaktifkan (stok habis) */
        .btn-disabled {
            background-color: #94a3b8 !important;
            cursor: not-allowed !important;
        }

        .seller-info-panel {
            grid-column: 1 / -1;
            background: #faf5ff;
            border-top: 1px dashed #e9d5ff;
            padding-top: 0.4rem;
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        /* FITUR BARU: Container checkbox di mode penjual */
        .stock-checkbox-container {
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #e9d5ff;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 600;
        }
        
        .stock-checkbox-container input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        
        .stock-checkbox-container label {
            cursor: pointer;
        }

        .seller-info-panel h4 {
            color: #6b21a8;
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
        }

        .seller-meta span {
            font-weight: 700;
            color: #4c1d95;
        }

        /* --- MODAL INPUT NOMOR TUJUAN --- */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center; 
            justify-content: center;
            padding: 1rem;
        }
        
        .modal-content {
            background: #fff; 
            border-radius: 12px; 
            padding: 1.5rem; 
            width: 100%; 
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp { 
            from { transform: translateY(20px); opacity:0; } 
            to { transform: translateY(0); opacity:1; } 
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .modal-body p {
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-wrapper label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-wrapper input {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.75rem;
            display: none;
            font-weight: 600;
        }

        .modal-actions {
            display: flex; 
            gap: 0.5rem; 
            justify-content: flex-end; 
            margin-top: 1.5rem;
        }

        .btn-cancel, .btn-confirm { 
            padding: 0.5rem 1rem; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem;
        }

        .btn-cancel { 
            background: #e2e8f0; 
            color: #334155; 
        }

        .btn-confirm { 
            background: var(--success-color); 
            color: #fff; 
        }

        /* --- TOAST NOTIFICATION --- */
        .toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #334155;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 400px) {
            .product-card {
                grid-template-columns: 2fr 1.3fr 1.1fr;
                padding: 0.5rem;
                gap: 0.3rem;
            }
            .prod-name { font-size: 0.8rem; }
            .prod-price { font-size: 0.85rem; }
            .btn-buy { font-size: 0.75rem; padding: 0.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <button class="admin-trigger" id="adminBtn" onclick="toggleAdminMode()">🔒 Mode Penjual</button>
        <h1>Udin Kuota</h1>
        <p>List harga kuota internet terlengkap. Langsung order ke WhatsApp!</p>
    </header>

    <!-- ADMIN PANEL FORM -->
    <div class="admin-form-container" id="adminFormContainer">
        <div class="admin-card-form">
            <h3>🛠️ Panel Input Paket Data Baru (Khusus Penjual)</h3>
            <form id="newProductForm" onsubmit="addNewProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="pName">Nama Paket/Produk</label>
                        <input type="text" id="pName" placeholder="Contoh: Mini Data 2GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pProvider">Provider Internet</label>
                        <select id="pProvider" required>
                            <option value="Telkomsel">Telkomsel</option>
                            <option value="Indosat">Indosat</option>
                            <option value="XL">XL</option>
                            <option value="Axis">Axis</option>
                            <option value="Three">Three</option>
                            <option value="Smartfren">Smartfren</option>
                            <option value="LiveOn">LiveOn</option>
                            <option value="ByU">ByU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pType">Kategori Durasi</label>
                        <select id="pType" required>
                            <option value="harian">⏳ Harian</option>
                            <option value="mingguan">🗓️ Mingguan/Bulanan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pQuota">Jumlah Kuota</label>
                        <input type="text" id="pQuota" placeholder="Contoh: 2 GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pActive">Masa Aktif</label>
                        <input type="text" id="pActive" placeholder="Contoh: 3 Hari" required>
                    </div>
                    <div class="form-group">
                        <label for="pPrice">Harga Jual (Rupiah)</label>
                        <input type="number" id="pPrice" placeholder="Contoh: 15000" required>
                    </div>
                    <div class="form-group">
                        <label for="pLocation">Lokasi Tembak Menu</label>
                        <input type="text" id="pLocation" placeholder="Isi Ulang Data > ..." required>
                    </div>
                    <div class="form-group">
                        <label for="pNote">Catatan Kulakan</label>
                        <input type="text" id="pNote" placeholder="Paket ada di menu..." required>
                    </div>
                </div>
                <button type="submit" class="btn-admin-submit">➕ Tambahkan ke Daftar Harga</button>
            </form>
        </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="tabs-container">
        <div class="tabs-wrapper" id="dynamicTabsWrapper">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>
    </div>

    <!-- SUB FILTERS & SORTING HARGA -->
    <div class="filters-row">
        <div class="sub-filters">
            <button class="sub-btn active" id="subAll" onclick="filterCategory('all')">Semua Durasi</button>
            <button class="sub-btn" id="subHarian" onclick="filterCategory('harian')">⏳ Harian</button>
            <button class="sub-btn" id="subMingguan" onclick="filterCategory('mingguan')">🗓️ Mingguan/Bulanan</button>
        </div>
        <div>
            <select id="sortPrice" class="sort-select" onchange="changeSort(this.value)">
                <option value="default">Urutan Bawaan</option>
                <option value="asc">Harga Termurah</option>
                <option value="desc">Harga Termahal</option>
            </select>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="container">
        <section>
            <h2 id="sectionTitle">📶 Semua Paket Internet</h2>
            <div class="product-grid" id="productGrid">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </section>
    </main>

    <!-- MODAL INPUT NOMOR -->
    <div id="buyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Pembelian</div>
            <div class="modal-body">
                <p id="modalPackageName">Nama Paket: -</p>
                <p id="modalPackagePrice">Harga: -</p>
                
                <div class="input-wrapper">
                    <label for="targetNumber">Nomor Tujuan (Opsional)</label>
                    <input type="number" id="targetNumber" placeholder="Contoh: 0812... atau 628...">
                    <span id="numberError" class="error-msg">Nomor harus diawali 08 atau 62.</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-confirm" onclick="processBuy()">Lanjut ke WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">✅ Paket berhasil dipilih, mengarahkan ke WhatsApp...</div>

    
    <script src="script.js"></script>
</body>
</html>
