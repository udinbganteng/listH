<head>

        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #16a34a;
            --success-hover: #15803d;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --admin-color: #4f46e5;
            --admin-bg: #f5f3ff;
            --admin-border: #ddd6fe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 20px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary-color), #3b82f6);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* --- LOCK/ADMIN TRIGGER BUTTON --- */
        .admin-trigger {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- FORM TAMBAH PRODUK (SELLER ONLY) --- */
        .admin-form-container {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: none;
        }

        .admin-card-form {
            background: var(--admin-bg);
            border: 2px dashed var(--admin-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .admin-card-form h3 {
            color: #5b21b6;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4c1d95;
        }

        .form-group input,
        .form-group select {
            padding: 0.4rem;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            background: #ffffff;
        }

        .btn-admin-submit {
            background-color: var(--admin-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        /* --- FILTER NAVIGATION (DYNAMIC TABS) --- */
        .tabs-container {
            max-width: 1200px;
            margin: 0 auto 0.5rem auto;
            padding: 0 0.75rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tabs-wrapper {
            display: flex;
            gap: 0.4rem;
            padding-bottom: 4px;
        }

        .tab-btn {
            padding: 0.4rem 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* --- SUB-FILTER KATEGORI --- */
        .sub-filters {
            max-width: 1200px;
            margin: 0 auto 1rem auto;
            padding: 0 0.75rem;
            display: flex;
            gap: 0.4rem;
        }

        .sub-btn {
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .sub-btn.active {
            background-color: #e2e8f0;
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        /* --- MAIN LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 0.75rem;
        }

        section h2 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.25rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* --- HORIZONTAL PRODUCT LIST (MOBILE OPTIMIZED) --- */
        .product-grid {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            display: grid;
            grid-template-columns: 2.5fr 1.5fr 1.2fr;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            transition: box-shadow 0.2s;
        }

        /* Badge Provider Visual */
        .badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
        }

        .telkomsel {
            background: #fee2e2;
            color: #ef4444;
        }

        .indosat {
            background: #fef3c7;
            color: #d97706;
        }

        .xl {
            background: #dbeafe;
            color: #2563eb;
        }

        .axis {
            background: #f3e8ff;
            color: #9333ea;
        }

        .three {
            background: #f1f5f9;
            color: #0f172a;
        }

        .smartfren {
            background: #fce7f3;
            color: #db2777;
        }

        .liveon {
            background: #e0f2fe;
            color: #0369a1;
        }

        .byu {
            background: #e0f2fe;
            color: #06b6d4;
        }

        .prod-info-main {
            display: flex;
            flex-direction: column;
        }

        .prod-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prod-meta-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .prod-price-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .prod-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .prod-active-period {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .btn-buy {
            width: 100%;
            padding: 0.45rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            background-color: var(--success-color);
            color: white;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--success-hover);
        }

        /* --- SELLER/ADMIN VIEW PANEL (FULL WIDTH UNDER CARD) --- */
        .seller-info-panel {

            border-top: 1px dashed #e9d5ff;
            padding-top: 0.4rem;
            margin-top: 0.2rem;
            font-size: 0.75rem;
        }

        .seller-info-panel h4 {
            color: #6b21a8;
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
        }

        .seller-meta span {
            font-weight: 700;
            color: #4c1d95;
        }

        @media (max-width: 400px) {
            .product-card {
                grid-template-columns: 2fr 1.3fr 1.1fr;
                padding: 0.5rem;
                gap: 0.3rem;
            }

            .prod-name {
                font-size: 0.8rem;
            }

            .prod-price {
                font-size: 0.85rem;
            }

            .btn-buy {
                font-size: 0.75rem;
                padding: 0.4rem;
            }

</head>

    <header>
        <button class="admin-trigger" id="adminBtn" onclick="toggleAdminMode()">🔒 Mode Penjual</button>
        <h1>Kuotaku Store</h1>
        <p>List harga kuota internet terlengkap. Sekali klik langsung order ke WhatsApp!</p>
    </header>

    <div class="admin-form-container" id="adminFormContainer">
        <div class="admin-card-form">
            <h3>🛠️ Panel Input Paket Data Baru (Khusus Penjual)</h3>
            <form id="newProductForm" onsubmit="addNewProduct(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="pName">Nama Paket/Produk</label>
                        <input type="text" id="pName" placeholder="Contoh: Mini Data 2GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pProvider">Provider</label>
                        <select id="pProvider" required>
                            <option value="Telkomsel">Telkomsel</option>
                            <option value="Indosat">Indosat</option>
                            <option value="XL">XL</option>
                            <option value="Axis">Axis</option>
                            <option value="Three">Three</option>
                            <option value="Smartfren">Smartfren</option>
                            <option value="LiveOn">LiveOn</option>
                            <option value="ByU">ByU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pType">Kategori Durasi</label>
                        <select id="pType" required>
                            <option value="harian">⏳ Harian</option>
                            <option value="mingguan">🗓️ Mingguan/Bulanan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pQuota">Jumlah Kuota</label>
                        <input type="text" id="pQuota" placeholder="Contoh: 2 GB" required>
                    </div>
                    <div class="form-group">
                        <label for="pActive">Masa Aktif</label>
                        <input type="text" id="pActive" placeholder="Contoh: 3 Hari" required>
                    </div>
                    <div class="form-group">
                        <label for="pPrice">Harga Jual (Rupiah)</label>
                        <input type="number" id="pPrice" placeholder="Contoh: 15000" required>
                    </div>
                    <div class="form-group">
                        <label for="pLocation">Lokasi Tembak Menu</label>
                        <input type="text" id="pLocation" placeholder="Isi Ulang Data > ..." required>
                    </div>
                    <div class="form-group">
                        <label for="pNote">Catatan Kulakan</label>
                        <input type="text" id="pNote" placeholder="Paket ada di menu..." required>
                    </div>
                </div>
                <button type="submit" class="btn-admin-submit">➕ Tambahkan ke Daftar Harga</button>
            </form>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs-wrapper" id="dynamicTabsWrapper">
        </div>
    </div>

    <div class="sub-filters">
        <button class="sub-btn active" id="subAll" onclick="filterCategory('all')">Semua Durasi</button>
        <button class="sub-btn" id="subHarian" onclick="filterCategory('harian')">⏳ Harian</button>
        <button class="sub-btn" id="subMingguan" onclick="filterCategory('mingguan')">🗓️ Mingguan/Bulanan</button>
    </div>

    <main class="container">
        <section>
            <h2 id="sectionTitle">📶 Semua Paket Internet</h2>
            <div class="product-grid" id="productGrid">
            </div>
        </section>
    </main>

            // XL
            { id: 80, name: "XL Xtra Combo 20GB", provider: "XL", type: "harian", quota: "20 GB", activePeriod: "30 Hari", price: 55000, class: "xl", location: "myXL > Xtra Combo Flex", note: "Ada bonus pilihan kuota aplikasi." },
            { id: 81, name: "XL Xtra Combo 20GB", provider: "XL", type: "mingguan", quota: "20 GB", activePeriod: "30 Hari", price: 55000, class: "xl", location: "myXL > Xtra Combo Flex", note: "Ada bonus pilihan kuota aplikasi." },

            // By.U
            { id: 90, name: "By.U Yang Bikin Nagih", provider: "ByU", quota: "12 GB", type: "harian", activePeriod: "30 Hari", price: 30000, class: "byu", location: "by.U App > Build Your Plan", note: "Jaringan ikut infrastruktur Telkomsel." },
            { id: 91, name: "By.U Yang Bikin Nagih", provider: "ByU", quota: "12 GB", type: "mingguan", activePeriod: "30 Hari", price: 30000, class: "byu", location: "by.U App > Build Your Plan", note: "Jaringan ikut infrastruktur Telkomsel." }
        ];

        let currentFilter = 'all';
        let currentCategory = 'all';
        let isAdminMode = false;

        // Inisialisasi Aplikasi saat Load Pertama Kali
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderProducts();
        });

        /* --- DINAMIS PROVIDER MENUS GENERATOR --- */
        function renderTabs() {
            const wrapper = document.getElementById('dynamicTabsWrapper');

            // Mendapatkan daftar nama provider unik dari data object products secara otomatis
            const uniqueProviders = ['all'];
            products.forEach(p => {
                if (!uniqueProviders.includes(p.provider)) {
                    uniqueProviders.push(p.provider);
                }
            });

            // Map penyebutan nama display agar rapi di UI
            const providerNames = {
                'all': '🔥 Semua',
                'Telkomsel': '🔴 Telkomsel',
                'Indosat': '🟡 Indosat',
                'XL': '🔵 XL Axiata',
                'Axis': '🟣 Axis',
                'Three': '⚫ Three (3)',
                'Smartfren': '💗 Smartfren',
                'LiveOn': '💎 Live.On',
                'ByU': '🔷 By.U'
            };

            wrapper.innerHTML = uniqueProviders.map(prov => {
                const displayName = providerNames[prov] || prov;
                const activeClass = currentFilter === prov ? 'active' : '';
                return `<button class="tab-btn ${activeClass}" id="tab-${prov}" onclick="filterProvider('${prov}')">${displayName}</button>`;
            }).join('');
        }

        /* --- LOGIKA REDIRECT AUTOMATIC KE WHATSAPP --- */
        function buyDirectToWhatsApp(id) {
            const item = products.find(p => p.id === id);
            if (!item) return;

            const formatPrice = item.price.toLocaleString('id-ID');

            // Format Pesan Teks Sesuai Ketentuan
            const rawMessage = `Halo, saya ingin membeli paket berikut:\n` +
                `Provider: ${item.provider}\n` +
                `Nama Paket: ${item.name}\n` +
                `Kuota: ${item.quota}\n` +
                `Masa Aktif: ${item.activePeriod}\n` +
                `Harga: Rp ${formatPrice}`+
                `Lokasi: ${item.location}`;

            const encodedText = encodeURIComponent(rawMessage);
            const waUrl = `https://api.whatsapp.com/send?phone=${NOMOR_WA}&text=${encodedText}`;

            // Buka tab WhatsApp Baru
            window.open(waUrl, '_blank');
        }

        /* --- RENDER DAFTAR PRODUK (LAYOUT HORIZONTAL CARD) --- */
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchProv = (currentFilter === 'all' || p.provider === currentFilter);
                const matchCat = (currentCategory === 'all' || p.type === currentCategory);
                return matchProv && matchCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.9rem;">Paket tidak ditemukan.</div>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';

                // Buat Tampilan Detail Penjual Aktif jika isAdminMode = true
                let adminPanelHtml = '';
                if (isAdminMode) {
                    adminPanelHtml = `
                        <div class="seller-info-panel">
                            <h4>🛠️ Data Kulakan Seller:</h4>
                            <div class="seller-meta">📍 Tembak: <span>${p.location}</span></div>
                            <div class="seller-meta">📝 Note: <span>${p.note}</span></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="prod-info-main">
                        <div><span class="badge ${p.class}">${p.provider}</span></div>
                        <div class="prod-name" title="${p.name}">${p.name}</div>
                        <div class="prod-meta-sub">${p.quota}</div>
                    </div>
                    <div class="prod-price-box">
                        <div class="prod-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        <div class="prod-active-period">⌛ ${p.activePeriod}</div>
                    </div>
                    <div>
                        <button class="btn-buy" onclick="buyDirectToWhatsApp(${p.id})">Beli</button>
                    </div>
                    ${adminPanelHtml}
                `;
                grid.appendChild(card);
            });
        }

        /* --- CONTROLLER FILTER SYSTEM --- */
        function filterProvider(prov) {
            currentFilter = prov;

            // Update active state tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${prov}`);
            if (activeTab) activeTab.classList.add('active');

            // Update Section Title
            const providerTitles = { 'all': 'Semua Paket Internet' };
            document.getElementById('sectionTitle').innerText = `📶 ${providerTitles[prov] || 'Paket ' + prov}`;

            renderProducts();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));

            if (cat === 'all') document.getElementById('subAll').classList.add('active');
            if (cat === 'harian') document.getElementById('subHarian').classList.add('active');
            if (cat === 'mingguan') document.getElementById('subMingguan').classList.add('active');

            renderProducts();
        }

        /* --- SELLER INTERNAL FEATURES CONTROL --- */
        function toggleAdminMode() {
            const formContainer = document.getElementById('adminFormContainer');
            if (!isAdminMode) {
                const password = prompt("Masukkan Kode Keamanan Penjual:");
                if (password === "ujangRonda") {
                    isAdminMode = true;
                    document.getElementById('adminBtn').innerText = "🔓 Mode Penjual (Aktif)";
                    document.getElementById('adminBtn').style.background = "var(--danger-color)";
                    formContainer.style.display = 'block';
                    alert("Akses diterima. Informasi menu penembakan rahasia di bawah produk sekarang aktif.");
                    renderProducts();
                } else {
                    alert("Kode salah!");
                }
            } else {
                isAdminMode = false;
                document.getElementById('adminBtn').innerText = "🔒 Mode Penjual";
                document.getElementById('adminBtn').style.background = "rgba(255, 255, 255, 0.2)";
                formContainer.style.display = 'none';
                renderProducts();
            }
        }

        function addNewProduct(event) {
            event.preventDefault();

            const name = document.getElementById('pName').value;
            const provider = document.getElementById('pProvider').value;
            const type = document.getElementById('pType').value;
            const quota = document.getElementById('pQuota').value;
            const activePeriod = document.getElementById('pActive').value;
            const price = parseInt(document.getElementById('pPrice').value);
            const location = document.getElementById('pLocation').value;
            const note = document.getElementById('pNote').value;

            // Penentuan CSS Class Badge Otomatis
            let providerClass = provider.toLowerCase();
            if (provider === "XL") providerClass = "xl";
            if (provider === "ByU") providerClass = "byu";
            if (provider === "LiveOn") providerClass = "liveon";

            const newProduct = {
                id: Date.now(),
                name, provider, type, quota, activePeriod, price,
                class: providerClass, location, note
            };

            products.push(newProduct);
            alert(`Paket "${name}" Berhasil ditambahkan ke Aplikasi!`);

            document.getElementById('newProductForm').reset();
            renderTabs(); // Refresh tab bar jika ada provider baru
            renderProducts();
        }
    </script>
</body>

</html>
